server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    gzip_min_length 1024;

    # One URL per page: /about/ -> /about
    rewrite ^/(.+)/$ /$1 permanent;

    # Cache hashed build assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # App routes: the prerendered page when there is one (scripts/prerender.ts), else the app shell
    location ~ ^/(tour|destinations|collections|blog|hotels|reset-password|verify-email|bookings|checkout|admin)(/|$) {
        try_files $uri $uri.html /spa.html;
    }
    location ~ ^/(flights|login|register|forgot-password|dashboard|book|write-article)$ {
        try_files $uri $uri.html /spa.html;
    }

    # Everything else is a prerendered page or a real 404 (the app still renders its not-found page)
    location / {
        try_files $uri $uri.html =404;
    }
    error_page 404 /404.html;
}
