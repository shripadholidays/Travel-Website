<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F97316" />

  <!-- Primary SEO -->
  <title>Wandeazy — Premium Travel & Tour Booking</title>
  <meta name="description"
    content="Discover and book premium travel experiences to the world's most breathtaking destinations with Wandeazy. Curated tours, easy booking, and unforgettable journeys." />
  <meta name="keywords"
    content="travel, tours, vacation packages, holiday booking, destinations, travel deals, tour booking, Wandeazy" />
  <meta name="author" content="Wandeazy" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://wandeazy.com/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Wandeazy" />
  <meta property="og:title" content="Wandeazy — Premium Travel & Tour Booking" />
  <meta property="og:description"
    content="Discover and book premium travel experiences to the world's most breathtaking destinations with Wandeazy." />
  <meta property="og:url" content="https://wandeazy.com/" />
  <meta property="og:image" content="https://wandeazy.com/og-image.jpg" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Wandeazy — Premium Travel & Tour Booking" />
  <meta name="twitter:description"
    content="Discover and book premium travel experiences to the world's most breathtaking destinations with Wandeazy." />
  <meta name="twitter:image" content="https://wandeazy.com/og-image.jpg" />

  <!-- Performance: preconnect to image/font hosts -->
  <link rel="preconnect" href="https://images.unsplash.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- Organization structured data for rich results -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "Wandeazy",
      "description": "Premium travel and tour booking platform offering curated experiences to the world's most breathtaking destinations.",
      "url": "https://wandeazy.com",
      "logo": "https://wandeazy.com/favicon.svg",
      "sameAs": [
        "https://www.facebook.com/wandeazy",
        "https://www.instagram.com/wandeazy",
        "https://twitter.com/wandeazy"
      ]
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
