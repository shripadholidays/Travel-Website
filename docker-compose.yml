services:
  # ---- API server ----
  server:
    build: ./server
    container_name: wandeazy-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      # Turso when set; otherwise a SQLite file kept in the db-data volume
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-file:/app/data/wandeazy.db}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      # App / auth
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      MOCK_AUTH: ${MOCK_AUTH:-false}
      LOCAL_FRONTEND_ORIGIN: ${LOCAL_FRONTEND_ORIGIN:-http://localhost:3000}
      PRODUCTION_FRONTEND_ORIGIN: ${PRODUCTION_FRONTEND_ORIGIN:-http://localhost:3000}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      # Google OAuth (optional)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      # Razorpay (optional)
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      # Email (optional)
      MAILGUN_HOST: ${MAILGUN_HOST:-}
      MAILGUN_PORT: ${MAILGUN_PORT:-}
      MAILGUN_SECURE: ${MAILGUN_SECURE:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
    volumes:
      - db-data:/app/data
      - uploads:/app/uploads
    ports:
      - "8080:8080"

  # ---- Frontend (nginx) ----
  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
        VITE_GOOGLE_OAUTH_CLIENT_ID: ${VITE_GOOGLE_OAUTH_CLIENT_ID:-}
    container_name: wandeazy-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:80"

volumes:
  db-data:
  uploads:
